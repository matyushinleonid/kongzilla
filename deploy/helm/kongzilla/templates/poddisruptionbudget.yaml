{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kongzilla.fullname" . }}
  labels:
    {{- include "kongzilla.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  # The site's pods only: the beacon is one replica and keeping it up is not
  # this budget's business.
  selector:
    matchLabels:
      {{- include "kongzilla.siteSelectorLabels" . | nindent 6 }}
{{- end }}
