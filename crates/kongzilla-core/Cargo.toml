[package]
name = "kongzilla-core"
description = "Range and board analysis engine for Texas Hold'em"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
# Only the tests need it: a shared link is text, and a round trip through the
# struct alone cannot catch a field that has no way back out of the text.
serde_json = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
